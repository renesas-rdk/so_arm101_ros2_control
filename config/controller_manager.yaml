# ROS 2 Controller Manager Configuration for SO ARM101
# This file defines the controller manager settings and available controllers

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz - Main control loop frequency

    # Use the ROS 2 parameter server for configuration
    use_sim_time: false

    # Available controllers (not all need to be loaded at once)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Position-based controllers
    so_arm101_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Joint position controller for direct position commands
    so_arm101_joint_position_controller:
      type: position_controllers/JointGroupPositionController

    # Cartesian controllers for advanced manipulation
    so_arm101_cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

    so_arm101_motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle

    # Gripper controller
    so_arm101_gripper_position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    use_urdf_to_filter: false
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
    interfaces: [position, velocity]
